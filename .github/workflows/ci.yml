name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # build/generate need a syntactically valid URL, but nothing connects during build
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx prisma generate
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: yarn install --frozen-lockfile
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}

  smoke:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deploy to settle
        run: sleep 90
      - run: curl -fsS "${{ vars.PROD_URL }}/api/plans" | head -c 400
